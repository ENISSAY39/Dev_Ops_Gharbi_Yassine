name: CI devops 2025

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Finally build your app with the latest command and run tests with 
        run: cd TP1/simple-api-student && mvn clean verify 