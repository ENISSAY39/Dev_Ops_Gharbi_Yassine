services:

  database:
    build: ./database
    container_name: postgres-db
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - app-network

  backend:
    build: ./simple-api-student
    container_name: simpleapi
    restart: unless-stopped
    depends_on:
    - database
    networks:
    - app-network

  httpd:
    build: ./http-server
    container_name: apache
    restart: unless-stopped
    ports:
    - "80:80"
    depends_on:
    - backend
    networks:
    - app-network

networks:
  app-network:

volumes:
  postgres-data:
